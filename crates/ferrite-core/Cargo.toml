[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-lc-rs = "1.18.2"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
blake3 = "1.8.7"
cbc = { version = "0.2.1", features = ["alloc"] }
cms = "=0.3.0-pre.1"
crc32fast = "1.5.3"
bytes = "1.12.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
dashmap = "6.2.1"
der = { version = "0.8.2", features = ["alloc", "derive", "oid"] }
des = "0.9.0"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
hkdf = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mail-auth = { version = "0.13.3", default-features = false, features = ["aws-lc-rs"] }
mail-parser = "0.11.9"
mime_guess = "2.0.5"
p12-keystore = "0.4.1"
pkcs8 = { version = "0.11.0", features = ["encryption"] }
parking_lot = "0.13.0"
quick-xml = "0.41.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
webpki-roots = "1.0.10"
x509-cert = "0.3.0"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
yrs = { version = "0.28.0", features = ["sync"] }
zeroize = "1.9.1"

[features]
# Test helpers (an SMTP sink) for this and dependent crates' tests.
test-util = []

[dev-dependencies]
tempfile = "3.27.0"
